name: Publish Arborist v0.4.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.4.2.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download tested main CI wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38774198101 \
            --repo "${GITHUB_REPOSITORY}" \
            --name endstone-arborist-3.14 \
            --dir release-dist
          test -f release-dist/endstone_arborist-0.4.2-py3-none-any.whl

      - name: Validate wheel metadata and integrity
        run: |
          python3 - <<'PY'
          from email.parser import Parser
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile

          wheel = Path("release-dist/endstone_arborist-0.4.2-py3-none-any.whl")
          with ZipFile(wheel) as archive:
              assert archive.testzip() is None
              entries = archive.namelist()
              metadata_file, = (x for x in entries if x.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(archive.read(metadata_file).decode())
              assert metadata["Name"] == "endstone-arborist"
              assert metadata["Version"] == "0.4.2"
              assert metadata["Requires-Python"] == ">=3.11"
              assert metadata["License-Expression"] == "GPL-3.0-only"
              entry_file, = (x for x in entries if x.endswith(".dist-info/entry_points.txt"))
              assert "arborist = endstone_arborist:ArboristPlugin" in archive.read(entry_file).decode()
              assert "endstone_arborist/config.toml" in entries
              assert "endstone_arborist/sowing.py" in entries
              assert any(x.endswith(".dist-info/licenses/LICENSE") for x in entries)
          print("SHA256:", sha256(wheel.read_bytes()).hexdigest())
          PY

      - name: Publish v0.4.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.2 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "v0.4.2 already exists; refusing to overwrite"
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## Arborist v0.4.2

          Fixes Bedrock rejecting `/arb tree status` and other tree subcommands in v0.4.1.

          ### Fixed
          - Give `tree` and `sow` disjoint native command overloads so that Bedrock no longer has to select between overlapping first-argument enum types.
          - Keep native command completion and the public `/arb tree on|off|status`, `/arb tree density compact|default|sparse|server`, `/arb sow on|off|status`, `/arb status`, and `/arb reload` interfaces unchanged.
          - Reject invalid combinations like `/arb tree on compact`.
          - Add regression checks for distinct enum registrations and unique matching for all supported command forms.

          ### Updating
          - Install `endstone_arborist-0.4.2-py3-none-any.whl` to your Endstone Python environment with `uv pip install --reinstall --no-deps`, or put the wheel in `plugins/`, but not both.
          - Restart BDS fully so it discards previously registered commands.
          - Keep your ClockMenu entries, server config, and player settings unchanged.

          CI passed on Python 3.11 through 3.15 (24 tests per Python version). This regression is covered by command-grammar tests; full live BDS confirmation remains outstanding. Python 3.15 CI validates pure-Python code and the wheel, not native Endstone installation.

          License: GPL-3.0-only.
          NOTES
          gh release create v0.4.2 \
            release-dist/endstone_arborist-0.4.2-py3-none-any.whl \
            --repo "${GITHUB_REPOSITORY}" \
            --target ca3a9ac66ee45a6fb5f126c65cdc47dd1339ab1d \
            --title "Arborist v0.4.2" \
            --notes-file release-notes.md
          gh release view v0.4.2 --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isDraft,isPrerelease,assets,url,targetCommitish
