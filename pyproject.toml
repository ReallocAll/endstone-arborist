[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "endstone-arborist"
version = "0.4.1"
description = "Automatic crop sowing and tree planting for Endstone servers"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "ReallocAll" }]
keywords = ["endstone", "minecraft", "bedrock", "arborist", "sapling", "crop", "sowing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["endstone>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.urls]
Repository = "https://github.com/ReallocAll/endstone-arborist"
Issues = "https://github.com/ReallocAll/endstone-arborist/issues"

[project.entry-points."endstone"]
arborist = "endstone_arborist:ArboristPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_arborist"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/AGENTS.md", "/pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
