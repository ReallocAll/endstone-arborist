name: Publish Arborist v0.4.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.4.0.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download main CI wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38444929364 --repo "${GITHUB_REPOSITORY}" --name endstone-arborist-3.14 --dir release-dist
          test -f release-dist/endstone_arborist-0.4.0-py3-none-any.whl

      - name: Check distribution metadata and integrity
        run: |
          python3 - <<'PY'
          from email.parser import Parser
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile

          wheel = Path("release-dist/endstone_arborist-0.4.0-py3-none-any.whl")
          with ZipFile(wheel) as archive:
              assert archive.testzip() is None
              files = archive.namelist()
              metadata_path, = (p for p in files if p.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(archive.read(metadata_path).decode())
              assert metadata["Name"] == "endstone-arborist"
              assert metadata["Version"] == "0.4.0"
              assert metadata["Requires-Python"] == ">=3.11"
              assert metadata["License-Expression"] == "GPL-3.0-only"
              entry_path, = (p for p in files if p.endswith(".dist-info/entry_points.txt"))
              assert "arborist = endstone_arborist:ArboristPlugin" in archive.read(entry_path).decode()
              assert "endstone_arborist/sowing.py" in files
              assert "endstone_arborist/config.toml" in files
              assert any(p.endswith(".dist-info/licenses/LICENSE") for p in files)
          print("SHA256:", sha256(wheel.read_bytes()).hexdigest())
          PY

      - name: Create private release from tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "v0.4.0 already published; refusing to overwrite"
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## Arborist v0.4.0

          Automatic crop sowing and spacing-aware tree planting for Endstone Bedrock servers.

          ### New
          - Independently enable automatic crop sowing with `/arb sow on`; sow wheat, carrots, potatoes or beetroot in empty farmland near the player while holding the corresponding item.
          - Crop sowing defaults to off and respects Spark TPS safeguards and Territory building permissions.
          - Lightweight main-thread sowing, up to 8 crops per batch in a configurable 4-block radius, with a default 5-tick cooldown. No additional worker thread.
          - Updated player/admin descriptions and eliminated gray `§7` formatting from planting tips.

          ### Breaking command change
          The legacy `/arb on`, `/arb off`, and `/arb density ...` forms are **removed**, not aliased.
          Use `/arb tree on|off|status`, `/arb tree density compact|default|sparse|server`,
          and `/arb sow on|off|status`. `/arb status` and `/arb reload` remain available.
          Update any ClockMenu commands before deploying.

          ### Installation / requirements
          - Python 3.11+ with a compatible Endstone 0.11+ build.
          - Install the attached `endstone_arborist-0.4.0-py3-none-any.whl` via `uv pip install` into the server Python environment or place the wheel in `plugins/`, but **not both**.
          - Spark and Endstone PAPI are required for TPS safeguards; unknown or low TPS pauses planting.
          - Existing per-player settings and server configuration remain intact; an explicitly configured `sow-cooldown = 10` must be changed manually to use the new 5-tick default.
          - Python 3.15 passed pure-Python tests and wheel validation; a compatible native Endstone distribution is separately required.
          - This release has passed CI but has not been verified against a live BDS world. Test inventory debit, crop block state and Territory boundaries before production deployment.

          License: GPL-3.0-only.
          NOTES
          gh release create v0.4.0 release-dist/endstone_arborist-0.4.0-py3-none-any.whl \
            --repo "${GITHUB_REPOSITORY}" \
            --target e95ac9ff60d39df680e824fedbaf6a83d8fe0988 \
            --title "Arborist v0.4.0" \
            --notes-file release-notes.md
          gh release view v0.4.0 --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,isPrerelease,assets,url,targetCommitish
