name: Publish Arborist v0.4.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.4.1.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified main CI wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38521586466 --repo "${GITHUB_REPOSITORY}" --name endstone-arborist-3.14 --dir release-dist
          test -f release-dist/endstone_arborist-0.4.1-py3-none-any.whl

      - name: Verify version, plugin entry point and wheel integrity
        run: |
          python3 - <<'PY'
          from email.parser import Parser
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile

          wheel = Path("release-dist/endstone_arborist-0.4.1-py3-none-any.whl")
          with ZipFile(wheel) as archive:
              assert archive.testzip() is None
              files = archive.namelist()
              metadata_path, = (p for p in files if p.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(archive.read(metadata_path).decode())
              assert metadata["Name"] == "endstone-arborist"
              assert metadata["Version"] == "0.4.1"
              assert metadata["Requires-Python"] == ">=3.11"
              assert metadata["License-Expression"] == "GPL-3.0-only"
              entry_path, = (p for p in files if p.endswith(".dist-info/entry_points.txt"))
              assert "arborist = endstone_arborist:ArboristPlugin" in archive.read(entry_path).decode()
              assert "endstone_arborist/sowing.py" in files
              assert "endstone_arborist/config.toml" in files
              assert any(p.endswith(".dist-info/licenses/LICENSE") for p in files)
          print("SHA256:", sha256(wheel.read_bytes()).hexdigest())
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "v0.4.1 already published; refusing to overwrite"
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## Arborist v0.4.1

          Patch release addressing duplicate Endstone command enum registration warnings introduced in v0.4.0.

          ### Fixed
          - Remove repeated anonymous enum registrations (`ArboristTree` and `ArboristOnOffStatus`) by combining the two toggle-command overloads into one `tree|sow` usage.
          - Preserve Bedrock native command autocomplete, command semantics, configuration, and player settings. No planting or protection behavior changed.
          - Add regression coverage for generated command-enum name uniqueness.

          ### Commands (unchanged from v0.4.0)
          - `/arb tree on|off|status`
          - `/arb tree density compact|default|sparse|server`
          - `/arb sow on|off|status`
          - `/arb status` and `/arb reload`

          ### Update
          - Python 3.11+ and compatible Endstone 0.11+ runtime.
          - Install the wheel through `uv pip install --python /path/to/python --reinstall --no-deps path/to/wheel`, or place it in `plugins/`, but do not use both installation methods.
          - Restart Endstone/BDS after replacing the wheel to discard any old enum registrations.
          - No additional player-data or config migration is needed.

          CI: Python 3.11–3.15. As with prior releases, a matching native Endstone wheel is required; Python 3.15 CI covers the pure-Python layer without BDS runtime validation.

          License: GPL-3.0-only.
          NOTES
          gh release create v0.4.1 release-dist/endstone_arborist-0.4.1-py3-none-any.whl \
            --repo "${GITHUB_REPOSITORY}" \
            --target d27a1cf188366062191149c442bf440a96fcc0d3 \
            --title "Arborist v0.4.1" \
            --notes-file release-notes.md
          gh release view v0.4.1 --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,isPrerelease,assets,url,targetCommitish
